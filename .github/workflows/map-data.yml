name: Map data catalog

on:
  pull_request:
    paths:
      - 'Maps VN/Cities/**'
      - 'scripts/verify-map-data.py'
      - 'scripts/test-map-data.py'
      - 'scripts/check-ci-runner.sh'
      - '.gitattributes'
      - '.github/workflows/map-data.yml'
  push:
    branches: [main, mvp]
    paths:
      - 'Maps VN/Cities/**'
      - 'scripts/verify-map-data.py'
      - 'scripts/test-map-data.py'
      - 'scripts/check-ci-runner.sh'
      - '.gitattributes'
      - '.github/workflows/map-data.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate map catalog
    runs-on: [self-hosted, linux, team-44]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify runner tools
        run: bash scripts/check-ci-runner.sh python
      - name: Verify map catalog
        run: python scripts/verify-map-data.py
      - name: Test map catalog
        run: python scripts/test-map-data.py
