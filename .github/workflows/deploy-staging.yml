name: Deploy staging
run-name: Deploy staging · CI ${{ github.event.workflow_run.id || inputs.ci_run_id }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run ID to deploy (from its Actions URL)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  deploy-staging:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      target: staging
      ci_run_id: ${{ format('{0}', github.event.workflow_run.id || inputs.ci_run_id) }}
      coolify_url: ${{ vars.COOLIFY_STAGING_URL }}
      service_uuid: ${{ vars.COOLIFY_STAGING_SERVICE_UUID }}
    secrets:
      coolify_token: ${{ secrets.COOLIFY_STAGING_TOKEN }}
