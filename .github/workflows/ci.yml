name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  mcp-images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image of every MCP server
        run: make mcp-build

      - name: Smoke test every MCP server container
        run: |
          for dockerfile in src/mcp_servers/*/Dockerfile; do
            server=$(basename "$(dirname "$dockerfile")")
            port=$(awk '/^EXPOSE/ {print $2; exit}' "$dockerfile")
            docker run -d --name "$server-mcp" -p "$port:$port" "$server-mcp:latest"
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$server-mcp")" = healthy ] && break
              sleep 2
            done
            curl --fail --silent "http://localhost:$port/health"
            echo
            docker rm -f "$server-mcp"
          done

  lifeflow-typescript:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Maps VN/LifeFlow

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Maps VN/LifeFlow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript workspaces
        run: npm run build

      - name: Run portable workspace tests
        run: npm run test:ci
