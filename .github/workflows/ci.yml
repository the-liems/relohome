name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  mcp-images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image of every MCP server
        run: make mcp-build

      - name: Smoke test flights-mcp container
        run: |
          docker run -d --name flights-mcp -p 8765:8765 flights-mcp:latest
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' flights-mcp)" = healthy ] && break
            sleep 2
          done
          curl --fail --silent http://localhost:8765/health
          docker rm -f flights-mcp
