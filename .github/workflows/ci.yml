name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  lifeflow-typescript:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Maps VN/LifeFlow

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Maps VN/LifeFlow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript workspaces
        run: npm run build

      - name: Run portable workspace tests
        run: npm run test:ci
