name: Deploy production
run-name: Deploy production · CI ${{ inputs.ci_run_id }}

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run ID already verified in staging
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      target: production
      ci_run_id: ${{ inputs.ci_run_id }}
      coolify_url: ${{ vars.COOLIFY_PRODUCTION_URL }}
      service_uuid: ${{ vars.COOLIFY_PRODUCTION_SERVICE_UUID }}
    secrets:
      coolify_token: ${{ secrets.COOLIFY_PRODUCTION_TOKEN }}
