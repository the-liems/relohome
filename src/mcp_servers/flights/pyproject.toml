[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relohome-flights-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["relohome-observability==0.1.0", "relohome-flight==0.1.0", "relohome-mcp-http==0.1.0"]

[tool.setuptools]
packages = ["relohome_flights_mcp"]
include-package-data = false

[tool.setuptools.package-dir]
"relohome_flights_mcp" = "."
