[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relohome-intake-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["relohome-agent-services==0.1.0", "uvicorn==0.53.0"]

[tool.setuptools]
packages = ["relohome_intake"]
include-package-data = false

[tool.setuptools.package-dir]
"relohome_intake" = "."
