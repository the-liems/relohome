[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relohome-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["relohome-observability==0.1.0", "fastapi>=0.115.0", "uvicorn[standard]>=0.34.0", "pydantic>=2.10.0", "pydantic-settings>=2.7.0", "python-dotenv>=1.0.0", "langchain>=0.3.0", "langchain-openai>=0.3.0", "langgraph>=1.0", "langgraph-checkpoint-sqlite>=3,<4", "cryptography>=44", "httpx>=0.28.0", "langchain-mcp-adapters>=0.3.2", "jsonschema==4.26.0", "relohome-contracts==0.1.0", "relohome-privacy==0.1.0", "relohome-roommate==0.1.0", "relohome-flight==0.1.0"]

[tool.setuptools]
packages = ["relohome_agent", "relohome_agent.agents", "relohome_agent.agents.contracts", "relohome_agent.agents.nodes", "relohome_agent.agents.subagents", "relohome_agent.agents.subagents.services", "relohome_agent.agents.tools", "relohome_agent.api", "relohome_agent.checkout", "relohome_agent.services", "relohome_agent.services.adapters"]
include-package-data = false

[tool.setuptools.package-dir]
"relohome_agent" = "."

[tool.setuptools.package-data]
"relohome_agent.agents.subagents" = ["fixtures/*.json"]
