services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AGENT_ALLOW_SIMULATED_TRANSACTIONS=${AGENT_ALLOW_SIMULATED_TRANSACTIONS-false}
      - AGENT_API_TOKEN=${AGENT_API_TOKEN-}
      - AGENT_FLIGHT_MODEL=${AGENT_FLIGHT_MODEL-gpt-6-luna}
      - AGENT_HOUSING_MODEL=${AGENT_HOUSING_MODEL-gpt-6-luna}
      - AGENT_INTAKE_MODEL=${AGENT_INTAKE_MODEL-gpt-6-luna}
      - AGENT_MAP_MODEL=${AGENT_MAP_MODEL-gpt-6-luna}
      - AGENT_MOVING_MODEL=${AGENT_MOVING_MODEL-gpt-6-luna}
      - AGENT_PAYMENT_MODEL=${AGENT_PAYMENT_MODEL-gpt-6-luna}
      - AGENT_PLANNER_MODEL=${AGENT_PLANNER_MODEL-gpt-6-luna}
      - AGENT_SANDBOX_PAYMENTS_ENABLED=${AGENT_SANDBOX_PAYMENTS_ENABLED-false}
      - AGENT_STATE_DIR=${AGENT_STATE_DIR-data/agent-runtime}
      - AGENT_SUBAGENTS=${AGENT_SUBAGENTS-live}
      - AGENT_WRITES_ENABLED=${AGENT_WRITES_ENABLED-false}
      - APP_ENV=${APP_ENV-development}
      - APP_HOST=${APP_HOST-0.0.0.0}
      - APP_PORT=${APP_PORT-8000}
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR-./data/chroma}
      - CORS_ORIGINS=${CORS_ORIGINS-http://localhost:3000,http://localhost:5173}
      - HOUSING_MESSAGE_RATE_PER_MINUTE=${HOUSING_MESSAGE_RATE_PER_MINUTE-10}
      - HOUSING_MODERATOR_IDS=${HOUSING_MODERATOR_IDS-}
      - HOUSING_REVIEW_LOW_STARS=${HOUSING_REVIEW_LOW_STARS-2}
      - HOUSING_REVIEW_MIN_COUNT=${HOUSING_REVIEW_MIN_COUNT-1}
      - HOUSING_REVIEW_PATTERN_AUTHORS=${HOUSING_REVIEW_PATTERN_AUTHORS-3}
      - HOUSING_REVIEW_PATTERN_DAYS=${HOUSING_REVIEW_PATTERN_DAYS-90}
      - HOUSING_REVIEW_PATTERN_PROPERTIES=${HOUSING_REVIEW_PATTERN_PROPERTIES-2}
      - HOUSING_SOURCE_PATH=${HOUSING_SOURCE_PATH-../Data/housing_clean_2026-09-26.jsonl}
      - HOUSING_SOURCE_VERSION=${HOUSING_SOURCE_VERSION-housing-clean-2026-09-26}
      - LOCATION_MCP_URL=${LOCATION_MCP_URL-http://127.0.0.1:4300/mcp}
      - LOG_LEVEL=${LOG_LEVEL-INFO}
      - MOVING_API_HOST=${MOVING_API_HOST-127.0.0.1}
      - MOVING_API_PORT=${MOVING_API_PORT-4200}
      - MOVING_APPROVAL_TOKEN=${MOVING_APPROVAL_TOKEN-}
      - MOVING_APPROVAL_URL=${MOVING_APPROVAL_URL-http://127.0.0.1:4200/v1/internal/moving/approvals}
      - MOVING_ENVIRONMENT=${MOVING_ENVIRONMENT-staging}
      - MOVING_MCP_ALLOWED_HOSTS=${MOVING_MCP_ALLOWED_HOSTS-localhost,127.0.0.1,moving-mcp}
      - MOVING_MCP_ALLOWED_ORIGINS=${MOVING_MCP_ALLOWED_ORIGINS-}
      - MOVING_MCP_AUTH_TOKEN=${MOVING_MCP_AUTH_TOKEN-}
      - MOVING_MCP_HOST=${MOVING_MCP_HOST-127.0.0.1}
      - MOVING_MCP_PORT=${MOVING_MCP_PORT-4400}
      - MOVING_MCP_URL=${MOVING_MCP_URL-http://127.0.0.1:4400/mcp}
      - MOVING_MCP_WRITE_TOKEN=${MOVING_MCP_WRITE_TOKEN-}
      - MOVING_QUOTE_CONTACT_MOBILE=${MOVING_QUOTE_CONTACT_MOBILE-}
      - MOVING_QUOTE_CONTACT_NAME=${MOVING_QUOTE_CONTACT_NAME-}
      - OPENAI_API_KEY=${OPENAI_API_KEY-}
      - PAYMENT_SIMULATION_ENABLED=${PAYMENT_SIMULATION_ENABLED-false}
      - ROOMMATE_DEMO_ENABLED=${ROOMMATE_DEMO_ENABLED-false}
      - ROOMMATE_ENABLED=${ROOMMATE_ENABLED-false}
      - ROOMMATE_MODERATORS=${ROOMMATE_MODERATORS-}
      - ROOMMATE_STATE_DIR=${ROOMMATE_STATE_DIR-logs/private-roommate}
      - DATABASE_URL=${BACKEND_DATABASE_URL:-sqlite:///./data/app.db}
      - LOCATION_MCP_AUTH_TOKEN=${LOCATION_TOKEN:?Set LOCATION_TOKEN}
      # Agent gọi flight MCP server trong container qua HTTP thay vì tự mở process stdio
      - FLIGHT_MCP_URL=http://flights-mcp:8765/mcp
      - FLIGHT_MCP_AUTH_TOKEN=${FLIGHT_MCP_AUTH_TOKEN:?}
      - PAYMENT_MCP_URL=http://payments-mcp:8766/mcp
      - PAYMENT_MCP_AUTH_TOKEN=${PAYMENT_MCP_AUTH_TOKEN:?}
    volumes:
      - ./data:/app/data
    depends_on:
      flights-mcp:
        condition: service_healthy
      payments-mcp:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- MCP servers: mỗi service một container, Dockerfile nằm trong src/mcp_servers/<tên>/ ----
  flights-mcp:
    build:
      context: .
      dockerfile: src/mcp_servers/flights/Dockerfile
    image: flights-mcp:latest
    ports:
      - "8765:8765"
    environment:
      - FLIGHT_MCP_AUTH_TOKEN=${FLIGHT_MCP_AUTH_TOKEN-}
      - FLIGHT_MCP_URL=${FLIGHT_MCP_URL-http://127.0.0.1:8765/mcp}
      - FLIGHT_SEARCH_PROVIDER=${FLIGHT_SEARCH_PROVIDER-serpapi}
      - FLIGHT_SERPAPI_API_KEY=${FLIGHT_SERPAPI_API_KEY-}
      - FLIGHT_SIMULATION_ENABLED=${FLIGHT_SIMULATION_ENABLED-false}
      # Ghi đè giá trị trong .env.local (vốn dành cho chạy local)
      - MCP_AUTH_TOKEN=${FLIGHT_MCP_AUTH_TOKEN:?}
      - FLIGHT_MCP_HOST=0.0.0.0
      - FLIGHT_MCP_PORT=8765
      - FLIGHT_DB_PATH=/app/data/flights.db
    volumes:
      - flights-data:/app/data
    restart: unless-stopped

  payments-mcp:
    build:
      context: .
      dockerfile: src/mcp_servers/payments/Dockerfile
    image: payments-mcp:latest
    ports:
      - "8766:8766"
    environment:
      - PAYMENT_MCP_AUTH_TOKEN=${PAYMENT_MCP_AUTH_TOKEN-}
      - PAYMENT_MCP_URL=${PAYMENT_MCP_URL-http://127.0.0.1:8766/mcp}
      - PAYMENT_ORDER_PREFIX=${PAYMENT_ORDER_PREFIX-P044}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER-zalopay}
      - PAYMENT_SIMULATION_ENABLED=${PAYMENT_SIMULATION_ENABLED-false}
      - PAYMENT_ZALOPAY_APP_ID=${PAYMENT_ZALOPAY_APP_ID-}
      - PAYMENT_ZALOPAY_KEY1=${PAYMENT_ZALOPAY_KEY1-}
      - PAYMENT_ZALOPAY_KEY2=${PAYMENT_ZALOPAY_KEY2-}
      - MCP_AUTH_TOKEN=${PAYMENT_MCP_AUTH_TOKEN:?}
      - PAYMENT_MCP_HOST=0.0.0.0
      - PAYMENT_MCP_PORT=8766
      - PAYMENT_DB_PATH=/app/data/payments.db
    volumes:
      - payments-data:/app/data
    restart: unless-stopped

volumes:
  flights-data:
  payments-data:
