services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      # Agent gọi flight MCP server trong container qua HTTP thay vì tự mở process stdio
      - ROOMMATE_STATE_DIR=/app/private-roommate
      - FLIGHT_MCP_URL=http://flights-mcp:8765/mcp
      - FLIGHT_MCP_AUTH_TOKEN=${FLIGHT_MCP_AUTH_TOKEN:?}
      - PAYMENT_MCP_URL=http://payments-mcp:8766/mcp
      - PAYMENT_MCP_AUTH_TOKEN=${PAYMENT_MCP_AUTH_TOKEN:?}
    volumes:
      - ./data:/app/data
      - roommate-private:/app/private-roommate
    depends_on:
      flights-mcp:
        condition: service_healthy
      payments-mcp:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- MCP servers: mỗi service một container, Dockerfile nằm trong apps/<tên>-mcp/ ----
  flights-mcp:
    build:
      context: .
      dockerfile: apps/flights-mcp/Dockerfile
    image: flights-mcp:latest
    ports:
      - "8765:8765"
    env_file:
      - .env.local
    environment:
      # Ghi đè giá trị trong .env.local (vốn dành cho chạy local)
      - MCP_AUTH_TOKEN=${FLIGHT_MCP_AUTH_TOKEN:?}
      - FLIGHT_MCP_HOST=0.0.0.0
      - FLIGHT_MCP_PORT=8765
      - FLIGHT_DB_PATH=/app/data/flights.db
    volumes:
      - flights-data:/app/data
    restart: unless-stopped

  payments-mcp:
    build:
      context: .
      dockerfile: apps/payments-mcp/Dockerfile
    image: payments-mcp:latest
    ports:
      - "8766:8766"
    env_file:
      - .env.local
    environment:
      - MCP_AUTH_TOKEN=${PAYMENT_MCP_AUTH_TOKEN:?}
      - PAYMENT_MCP_HOST=0.0.0.0
      - PAYMENT_MCP_PORT=8766
      - PAYMENT_DB_PATH=/app/data/payments.db
    volumes:
      - payments-data:/app/data
    restart: unless-stopped

volumes:
  roommate-private:
  flights-data:
  payments-data:
