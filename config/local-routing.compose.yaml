name: lifeflow-routing-local
services:
  hcm-driving:
    image: ghcr.io/project-osrm/osrm-backend@sha256:8a1b1bc938412f15f9b5b32d794c4ec6bf4a85dfbbabfa0a014b70b187edb53b
    command: ["osrm-routed", "--algorithm", "mld", "/data/hcm.osrm"]
    volumes:
      - ../data/teammate-snapshot/Routing/hcm/driving:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
