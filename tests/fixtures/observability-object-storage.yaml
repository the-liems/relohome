# Disposable smoke-test storage only. Never render this fixture for deployment.
services:
  smoke-object-storage:
    image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    environment: &storage-env
      MINIO_ROOT_USER: ${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID:?}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY:?}
      SMOKE_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:?}
      CORTEX_BUCKET: ${CORTEX_S3_BUCKET:?}
      LOKI_BUCKET: ${LOKI_S3_BUCKET:?}
    entrypoint: [minio]
    command: [server, --address, ":9000", /data]
    volumes: [smoke-object-storage:/data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 30
  smoke-object-storage-init:
    image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    restart: "no"
    environment: *storage-env
    entrypoint: [sh, -ec]
    command:
      - 'mc alias set local http://smoke-object-storage:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null; mc mb --ignore-existing "local/$${SMOKE_BUCKET}" "local/$${CORTEX_BUCKET}" "local/$${LOKI_BUCKET}"'
    depends_on:
      smoke-object-storage: {condition: service_healthy}
volumes:
  smoke-object-storage:
