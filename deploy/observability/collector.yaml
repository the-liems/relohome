extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 8388608
  prometheus/internal:
    config:
      scrape_configs:
        - job_name: collectors
          scrape_interval: 15s
          static_configs:
            - targets: [127.0.0.1:8888]
          # Preserve the scrape job as service.name instead of the Collector's target_info identity.
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: target_info
              action: drop
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource/environment:
    attributes:
      - {key: deployment.environment.name, value: "${env:OTEL_DEPLOYMENT_ENVIRONMENT}", action: upsert}
      - {key: environment, value: "${env:OTEL_DEPLOYMENT_ENVIRONMENT}", action: upsert}
      - {key: service.namespace, value: relohome, action: upsert}
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements: &resource-statements
          - keep_keys(attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name", "environment"])
      - context: span
        statements:
          - keep_keys(attributes, ["http.request.method", "http.method", "http.response.status_code", "http.status_code", "http.route", "db.system", "db.system.name", "db.operation", "db.operation.name", "server.address", "server.port", "rpc.system", "rpc.method", "error.type", "relohome.operation", "relohome.kind", "relohome.outcome", "relohome.origin_trace_id", "relohome.cache_hit", "langfuse.session.id", "langfuse.observation.type", "langfuse.observation.input", "langfuse.observation.output", "langfuse.observation.level", "gen_ai.system", "gen_ai.provider.name", "gen_ai.operation.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens"])
          - set(attributes["langfuse.environment"], resource.attributes["environment"])
          # The authenticated environment Collector is authoritative, including
          # legacy SDKs or applications with inconsistent environment settings.
          - delete_key(attributes, "langfuse.observation.input") where resource.attributes["environment"] == "production"
          - delete_key(attributes, "langfuse.observation.output") where resource.attributes["environment"] == "production"
          - truncate_all(attributes, 16384)
    log_statements:
      - context: resource
        statements: *resource-statements
      - context: log
        statements:
          - keep_keys(attributes, ["operation", "kind", "outcome", "duration_ms", "method", "route", "status", "source", "error_type"])
          - set(body, "application.log") where body != "http.completed" and body != "operation.completed"
    metric_statements:
      - context: resource
        statements: *resource-statements
      - context: datapoint
        statements:
          - keep_keys(attributes, ["operation", "kind", "outcome", "method", "route", "status", "provider", "model", "direction", "point", "event", "reason"])
  filter/metrics:
    error_mode: propagate
    metrics:
      metric:
        - not IsMatch(name, "^relohome\\.")
  batch:
    timeout: 2s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  # Each signal goes straight to its backend on the shared ingestion network.
  otlphttp/langfuse:
    traces_endpoint: http://langfuse:3000/api/public/otel/v1/traces
    auth:
      authenticator: basicauth/langfuse
    headers:
      x-langfuse-ingestion-version: "4"
    timeout: 10s
    sending_queue: &queue
      enabled: true
      num_consumers: 2
      queue_size: 200
      storage: file_storage
    retry_on_failure: &retry
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
  otlphttp/loki:
    logs_endpoint: http://loki:3100/otlp/v1/logs
    timeout: 10s
    sending_queue: *queue
    retry_on_failure: *retry
  otlphttp/cortex:
    metrics_endpoint: http://cortex:9009/api/v1/otlp/v1/metrics
    timeout: 10s
    sending_queue: *queue
    retry_on_failure: *retry
service:
  extensions: [health_check, file_storage, basicauth/langfuse]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                # Keep internal metric names stable for the provisioned Grafana queries.
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, transform/privacy, batch]
      exporters: [otlphttp/langfuse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, transform/privacy, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/metrics, resource/environment, transform/privacy, batch]
      exporters: [otlphttp/cortex]
    metrics/internal:
      receivers: [prometheus/internal]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [otlphttp/cortex]
