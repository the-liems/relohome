extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 8388608
  prometheus/internal:
    config:
      scrape_configs:
        - job_name: collectors
          scrape_interval: 15s
          static_configs:
            - targets: [127.0.0.1:8888]
          # Preserve the scrape job as service.name instead of the Collector's target_info identity.
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: target_info
              action: drop
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource/environment:
    attributes:
      - {key: deployment.environment.name, value: "${env:OTEL_DEPLOYMENT_ENVIRONMENT}", action: upsert}
      - {key: service.namespace, value: relohome, action: upsert}
      - {key: service.version, value: "${env:DEPLOYMENT_COMMIT}", action: upsert}
  # Langfuse shares the global tracer provider, so its spans also reach Tempo. Langfuse keeps the
  # prompt and completion text; Tempo keeps structure, timing, model and usage. Provider API keys
  # sent as query parameters (SerpApi, Vietmap) are masked in recorded URLs.
  transform/redact:
    error_mode: ignore
    trace_statements:
      - delete_matching_keys(span.attributes, "^langfuse\\.observation\\.(input|output)$")
      - replace_pattern(span.attributes["url.full"], "(?i)([?&]api_?key=)[^&]*", "$${1}REDACTED")
      - replace_pattern(span.attributes["url.query"], "(?i)((?:^|&)api_?key=)[^&]*", "$${1}REDACTED")
  # Optional PR enrichment must never prevent telemetry export.
  transform/preview:
    error_mode: ignore
    trace_statements:
    - context: resource
      statements: &preview_attributes
      - delete_key(attributes, "preview.id")
      - set(attributes["preview.hostname"], "${env:DEPLOYMENT_HOSTNAME}") where attributes["deployment.environment.name"] ==
        "preview"
      - set(attributes["preview.id"], ExtractPatterns(attributes["preview.hostname"], "^pr-(?P<id>[0-9]+)\\.[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)*$")["id"])
        where attributes["deployment.environment.name"] == "preview"
      - delete_key(attributes, "preview.hostname") where not (attributes["deployment.environment.name"] == "preview")
      - delete_key(attributes, "preview.id") where not (attributes["deployment.environment.name"] == "preview")
    log_statements:
    - context: resource
      statements: *preview_attributes
    metric_statements:
    - context: resource
      statements: *preview_attributes
  batch:
    timeout: 2s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  # Each signal goes straight to its backend on the shared ingestion network.
  otlphttp/tempo:
    traces_endpoint: http://tempo:4318/v1/traces
    timeout: 10s
    sending_queue: &queue
      enabled: true
      num_consumers: 2
      queue_size: 200
      storage: file_storage
    retry_on_failure: &retry
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
  otlphttp/loki:
    logs_endpoint: http://loki:3100/otlp/v1/logs
    timeout: 10s
    sending_queue: *queue
    retry_on_failure: *retry
  otlphttp/cortex:
    metrics_endpoint: http://cortex:9009/api/v1/otlp/v1/metrics
    timeout: 10s
    sending_queue: *queue
    retry_on_failure: *retry
service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                # Keep internal metric names stable for the provisioned Grafana queries.
                without_type_suffix: true
                without_units: true
  pipelines:
    traces/tempo:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, transform/redact, transform/preview, batch]
      exporters: [otlphttp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, transform/preview, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, transform/preview, batch]
      exporters: [otlphttp/cortex]
    metrics/internal:
      receivers: [prometheus/internal]
      processors: [memory_limiter, resource/environment, transform/preview, batch]
      exporters: [otlphttp/cortex]
