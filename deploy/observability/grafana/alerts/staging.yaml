apiVersion: 1
groups:
- orgId: 1
  name: relohome-staging
  folder: ReloHome
  interval: 30s
  rules:
  - uid: rh-staging-http-errors
    title: ReloHome HTTP error rate (staging)
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
      environment: staging
    annotations:
      summary: ReloHome HTTP error rate
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex-staging
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: (sum by (environment, service_name) (increase(relohome_http_requests_total{status=~"5.."}[10m])) / sum by (environment, service_name)
          (increase(relohome_http_requests_total[10m])) > 0.05) and (sum by (environment, service_name) (increase(relohome_http_requests_total[10m]))
          >= 20)
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex-staging
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
  - uid: rh-staging-ai-errors
    title: ReloHome agent/tool/provider failures (staging)
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
      environment: staging
    annotations:
      summary: ReloHome agent/tool/provider failures
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex-staging
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: (sum by (environment, service_name, kind) (increase(relohome_operations_total{kind=~"agent|tool|llm",outcome="error"}[10m])) / sum
          by (environment, service_name, kind) (increase(relohome_operations_total{kind=~"agent|tool|llm"}[10m])) > 0.05) and (sum by (environment,
          service_name, kind) (increase(relohome_operations_total{kind=~"agent|tool|llm"}[10m])) >= 20)
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex-staging
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
  - uid: rh-staging-provider-limits
    title: ReloHome provider rate limits (staging)
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
      environment: staging
    annotations:
      summary: ReloHome provider rate limits
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex-staging
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: sum by (environment, service_name, provider) (increase(relohome_provider_rate_limits_total[10m])) >= 3
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex-staging
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
  - uid: rh-staging-chat-latency
    title: ReloHome chat p95 above 120 seconds (staging)
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
      environment: staging
    annotations:
      summary: ReloHome chat p95 above 120 seconds
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex-staging
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: (histogram_quantile(0.95, sum by (le, environment, service_name) (rate(relohome_http_duration_seconds_bucket{route=~".*/chat"}[15m])))
          > 120) and (sum by (environment, service_name) (increase(relohome_http_duration_seconds_count{route=~".*/chat"}[15m])) >= 10)
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex-staging
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
  - uid: rh-staging-heartbeat
    title: ReloHome service heartbeat missing (staging)
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
      environment: staging
    annotations:
      summary: ReloHome service heartbeat missing
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex-staging
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: relohome_expected_service_info unless on (environment, service_name) (max by (environment, service_name) (relohome_heartbeat_seconds)
          > time() - 120)
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex-staging
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
  - uid: rh-staging-collector-down
    title: ReloHome Collector unavailable (staging)
    condition: B
    for: 2m
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
      environment: staging
    annotations:
      summary: ReloHome Collector unavailable
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex-staging
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: (up{service_name="collectors"} == bool 0) or absent(up{service_name="collectors"})
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex-staging
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
  - uid: rh-staging-export-failures
    title: ReloHome telemetry export failures (staging)
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
      environment: staging
    annotations:
      summary: ReloHome telemetry export failures
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex-staging
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: sum by (environment) ((rate(otelcol_exporter_send_failed_spans_total[5m]) > 0) or (rate(otelcol_exporter_send_failed_log_records_total[5m])
          > 0) or (rate(otelcol_exporter_send_failed_metric_points_total[5m]) > 0) or (rate(otelcol_exporter_enqueue_failed_spans_total[5m]) >
          0) or (rate(otelcol_exporter_enqueue_failed_log_records_total[5m]) > 0) or (rate(otelcol_exporter_enqueue_failed_metric_points_total[5m])
          > 0) or (rate(otelcol_receiver_refused_spans_total[5m]) > 0) or (rate(otelcol_receiver_refused_log_records_total[5m]) > 0) or (rate(otelcol_receiver_refused_metric_points_total[5m])
          > 0) or (rate(otelcol_receiver_failed_spans_total[5m]) > 0) or (rate(otelcol_receiver_failed_log_records_total[5m]) > 0) or (rate(otelcol_receiver_failed_metric_points_total[5m])
          > 0)) > 0
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex-staging
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
