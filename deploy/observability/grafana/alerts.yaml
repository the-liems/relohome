apiVersion: 1
groups:
- orgId: 1
  name: relohome
  folder: ReloHome
  interval: 30s
  rules:
  - uid: relohome-http-errors
    title: ReloHome HTTP error rate
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
    annotations:
      summary: ReloHome HTTP error rate
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: (sum by (environment, service_name) (increase(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[10m])) / sum by (environment, service_name)
          (increase(http_server_request_duration_seconds_count[10m])) > 0.05) and (sum by (environment, service_name) (increase(http_server_request_duration_seconds_count[10m]))
          >= 20)
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
  - uid: relohome-ai-errors
    title: ReloHome agent/tool/provider failures
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
    annotations:
      summary: ReloHome agent/tool/provider failures
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: (sum by (environment, service_name, kind) (increase(relohome_operations_total{kind=~"agent|tool|llm",outcome="error"}[10m])) / sum
          by (environment, service_name, kind) (increase(relohome_operations_total{kind=~"agent|tool|llm"}[10m])) > 0.05) and (sum by (environment,
          service_name, kind) (increase(relohome_operations_total{kind=~"agent|tool|llm"}[10m])) >= 20)
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
  - uid: relohome-provider-limits
    title: ReloHome provider rate limits
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
    annotations:
      summary: ReloHome provider rate limits
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: sum by (environment, service_name, provider) (increase(relohome_provider_rate_limits_total[10m])) >= 3
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
  - uid: relohome-chat-latency
    title: ReloHome chat p95 above 120 seconds
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
    annotations:
      summary: ReloHome chat p95 above 120 seconds
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: (histogram_quantile(0.95, sum by (le, environment, service_name) (rate(http_server_request_duration_seconds_bucket{http_route=~".*/chat"}[15m])))
          > 120) and (sum by (environment, service_name) (increase(http_server_request_duration_seconds_count{http_route=~".*/chat"}[15m])) >= 10)
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
  - uid: relohome-heartbeat
    title: ReloHome service heartbeat missing
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
    annotations:
      summary: ReloHome service heartbeat missing
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: group by (environment, service_name) (max_over_time(relohome_heartbeat_seconds[24h])) unless on (environment, service_name)
          (max by (environment, service_name) (relohome_heartbeat_seconds) > time() - 120)
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
  - uid: relohome-collector-down
    title: ReloHome Collector unavailable
    condition: B
    for: 2m
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
    annotations:
      summary: ReloHome Collector unavailable
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: group by (environment) (max_over_time(up{service_name="collectors"}[24h])) unless on (environment) (up{service_name="collectors"} == 1)
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
  - uid: relohome-export-failures
    title: ReloHome telemetry export failures
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      team: relohome
      severity: warning
    annotations:
      summary: ReloHome telemetry export failures
      description: Check the ReloHome dashboard and correlated traces.
    data:
    - refId: A
      datasourceUid: cortex
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: sum by (environment) ((rate(otelcol_exporter_send_failed_spans_total[5m]) > 0) or (rate(otelcol_exporter_send_failed_log_records_total[5m])
          > 0) or (rate(otelcol_exporter_send_failed_metric_points_total[5m]) > 0) or (rate(otelcol_exporter_enqueue_failed_spans_total[5m]) >
          0) or (rate(otelcol_exporter_enqueue_failed_log_records_total[5m]) > 0) or (rate(otelcol_exporter_enqueue_failed_metric_points_total[5m])
          > 0) or (rate(otelcol_receiver_refused_spans_total[5m]) > 0) or (rate(otelcol_receiver_refused_log_records_total[5m]) > 0) or (rate(otelcol_receiver_refused_metric_points_total[5m])
          > 0) or (rate(otelcol_receiver_failed_spans_total[5m]) > 0) or (rate(otelcol_receiver_failed_log_records_total[5m]) > 0) or (rate(otelcol_receiver_failed_metric_points_total[5m])
          > 0)) > 0
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: cortex
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
            params: []
