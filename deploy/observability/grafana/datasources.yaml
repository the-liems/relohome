apiVersion: 1
deleteDatasources:
- name: Prometheus
  orgId: 1
datasources:
- name: Cortex staging
  uid: cortex-staging
  type: prometheus
  access: proxy
  url: http://cortex:9009/prometheus
  isDefault: true
  editable: false
  jsonData:
    httpHeaderName1: X-Scope-OrgID
    httpMethod: POST
  secureJsonData:
    httpHeaderValue1: staging
- name: Loki staging
  uid: loki-staging
  type: loki
  access: proxy
  url: http://loki:3100
  editable: false
  jsonData:
    httpHeaderName1: X-Scope-OrgID
    derivedFields:
    - name: Langfuse trace
      matcherType: label
      matcherRegex: trace_id
      url: ${LANGFUSE_URL}/project/${LANGFUSE_STAGING_PROJECT_ID}/traces/$${__value.raw}
      urlDisplayLabel: Open trace in Langfuse
  secureJsonData:
    httpHeaderValue1: staging
- name: Cortex production
  uid: cortex-production
  type: prometheus
  access: proxy
  url: http://cortex:9009/prometheus
  isDefault: false
  editable: false
  jsonData:
    httpHeaderName1: X-Scope-OrgID
    httpMethod: POST
  secureJsonData:
    httpHeaderValue1: production
- name: Loki production
  uid: loki-production
  type: loki
  access: proxy
  url: http://loki:3100
  editable: false
  jsonData:
    httpHeaderName1: X-Scope-OrgID
    derivedFields:
    - name: Langfuse trace
      matcherType: label
      matcherRegex: trace_id
      url: ${LANGFUSE_URL}/project/${LANGFUSE_PRODUCTION_PROJECT_ID}/traces/$${__value.raw}
      urlDisplayLabel: Open trace in Langfuse
  secureJsonData:
    httpHeaderValue1: production
