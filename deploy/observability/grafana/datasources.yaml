apiVersion: 1
# One store each; dashboards and alerts filter by the environment label.
datasources:
- name: Cortex
  uid: cortex
  type: prometheus
  access: proxy
  url: http://cortex:9009/prometheus
  isDefault: true
  editable: false
  jsonData:
    httpMethod: POST
- name: Loki
  uid: loki
  type: loki
  access: proxy
  url: http://loki:3100
  editable: false
  jsonData:
    derivedFields:
    - name: Langfuse trace
      matcherType: label
      matcherRegex: trace_id
      url: ${LANGFUSE_URL}/project/relohome/traces/$${__value.raw}
      urlDisplayLabel: Open trace in Langfuse
