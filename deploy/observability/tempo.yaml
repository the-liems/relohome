# Single-host deployment; all query/ingestion ports stay on private Docker networks.
server:
  http_listen_port: 3200
  log_level: warn
stream_over_http_enabled: true
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: s3
    wal:
      path: /var/tempo/wal
    s3:
      bucket: ${TEMPO_S3_BUCKET}
      endpoint: ${TEMPO_S3_ENDPOINT}
      region: ${TEMPO_S3_REGION}
      access_key: ${TEMPO_S3_ACCESS_KEY_ID}
      secret_key: ${TEMPO_S3_SECRET_ACCESS_KEY}
      insecure: ${TEMPO_S3_INSECURE}
      forcepathstyle: ${TEMPO_S3_FORCE_PATH_STYLE}
# Preserve the 32-character trace ID in search results used by Grafana links.
overrides:
  defaults:
    read:
      left_pad_trace_ids: true
# Tempo 3's backend scheduler/worker use the default 14-day retention.
usage_report:
  reporting_enabled: false
