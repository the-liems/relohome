name: relohome-observability
x-service: &service
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
x-langfuse: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LF_POSTGRES_PASSWORD:?}@postgres:5432/langfuse
  NEXTAUTH_URL: ${LANGFUSE_URL:-http://localhost:3000}
  SALT: ${LF_SALT:?}
  ENCRYPTION_KEY: ${LF_ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LF_REDIS_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:?}
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: ${LANGFUSE_S3_EVENT_UPLOAD_PREFIX:-events/}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION:?}
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID:?}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT:?}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE:-false}
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
  LANGFUSE_IN_APP_AGENT_ENABLED: "false"
x-langfuse-depends: &langfuse-depends
  postgres: {condition: service_healthy}
  clickhouse: {condition: service_healthy}
  redis: {condition: service_healthy}
services:
  langfuse:
    <<: *service
    image: docker.langfuse.com/langfuse/langfuse:4.56.0
    mem_limit: 2g
    environment:
      <<: *langfuse-env
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_SECRET: ${LF_NEXTAUTH_SECRET:?}
      AUTH_DISABLE_SIGNUP: ${LF_AUTH_DISABLE_SIGNUP:-true}
      AUTH_DISABLE_USERNAME_PASSWORD: ${LF_AUTH_DISABLE_USERNAME_PASSWORD:-false}
      AUTH_CUSTOM_CLIENT_ID: ${LF_AUTH_CUSTOM_CLIENT_ID:-}
      AUTH_CUSTOM_CLIENT_SECRET: ${LF_AUTH_CUSTOM_CLIENT_SECRET:-}
      AUTH_CUSTOM_ISSUER: ${LF_AUTH_CUSTOM_ISSUER:-}
      AUTH_CUSTOM_NAME: Cloudflare
      AUTH_CUSTOM_SCOPE: "openid email profile"
      AUTH_CUSTOM_FETCH_USERINFO: "true"
      AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING: ${LF_AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING:-false}
      LANGFUSE_DEFAULT_ORG_ID: ${LF_DEFAULT_ORG_ID:-}
      LANGFUSE_DEFAULT_ORG_ROLE: VIEWER
      LANGFUSE_DEFAULT_PROJECT_ID: ${LF_DEFAULT_PROJECT_ID:-}
      LANGFUSE_DEFAULT_PROJECT_ROLE: VIEWER
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-relohome}
      LANGFUSE_INIT_ORG_NAME: ReloHome
      LANGFUSE_INIT_USER_EMAIL: ${OBS_ADMIN_EMAIL:?}
      LANGFUSE_INIT_USER_NAME: ReloHome Operator
      LANGFUSE_INIT_USER_PASSWORD: ${OBS_ADMIN_PASSWORD:?}
      LANGFUSE_INIT_PROJECT_ID: relohome
      LANGFUSE_INIT_PROJECT_NAME: ReloHome
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?}
    depends_on: *langfuse-depends
    ports: ["127.0.0.1:3000:3000"]
    networks: [default, ingestion]
  langfuse-worker:
    <<: *service
    image: docker.langfuse.com/langfuse/langfuse-worker:4.56.0
    mem_limit: 2g
    environment: *langfuse-env
    depends_on: *langfuse-depends
  postgres:
    <<: *service
    image: postgres:17.6-bookworm
    mem_limit: 512m
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
      POSTGRES_PASSWORD: ${LF_POSTGRES_PASSWORD:?}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, langfuse, -d, langfuse]
      interval: 5s
      timeout: 3s
      retries: 30
  clickhouse:
    <<: *service
    image: clickhouse/clickhouse-server:25.12.3.21
    mem_limit: 4g
    user: "101:101"
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      GRAFANA_CLICKHOUSE_PASSWORD: ${GRAFANA_CLICKHOUSE_PASSWORD:?}
    volumes:
      - clickhouse:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/grafana-user.xml:/etc/clickhouse-server/users.d/grafana.xml:ro
      - ./clickhouse/settings-constraints.xml:/etc/clickhouse-server/config.d/settings-constraints.xml:ro
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:8123/ping]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    <<: *service
    image: redis:7.4.6-bookworm
    mem_limit: 384m
    environment:
      REDIS_PASSWORD: ${LF_REDIS_PASSWORD:?}
    command: [sh, -ec, 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 30
  loki:
    <<: *service
    image: grafana/loki:3.7.8
    mem_limit: 768m
    command: [-config.file=/etc/loki/config.yaml, -config.expand-env=true]
    environment:
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET:?}
      LOKI_S3_ENDPOINT: ${LOKI_S3_ENDPOINT:?}
      LOKI_S3_REGION: ${LOKI_S3_REGION:?}
      LOKI_S3_ACCESS_KEY_ID: ${LOKI_S3_ACCESS_KEY_ID:?}
      LOKI_S3_SECRET_ACCESS_KEY: ${LOKI_S3_SECRET_ACCESS_KEY:?}
      LOKI_S3_INSECURE: ${LOKI_S3_INSECURE:-false}
      LOKI_S3_FORCE_PATH_STYLE: ${LOKI_S3_FORCE_PATH_STYLE:-false}
    volumes: [./loki.yaml:/etc/loki/config.yaml:ro, loki:/loki]
    networks: [default, ingestion]
  cortex:
    <<: *service
    image: quay.io/cortexproject/cortex:v1.21.1
    mem_limit: 2g
    command: [-config.file=/etc/cortex/config.yaml, -config.expand-env=true]
    environment:
      CORTEX_S3_BUCKET: ${CORTEX_S3_BUCKET:?}
      CORTEX_S3_ENDPOINT: ${CORTEX_S3_ENDPOINT:?}
      CORTEX_S3_REGION: ${CORTEX_S3_REGION:?}
      CORTEX_S3_ACCESS_KEY_ID: ${CORTEX_S3_ACCESS_KEY_ID:?}
      CORTEX_S3_SECRET_ACCESS_KEY: ${CORTEX_S3_SECRET_ACCESS_KEY:?}
      CORTEX_S3_INSECURE: ${CORTEX_S3_INSECURE:-false}
      CORTEX_S3_BUCKET_LOOKUP_TYPE: ${CORTEX_S3_BUCKET_LOOKUP_TYPE:-auto}
    volumes:
      - ./cortex.yaml:/etc/cortex/config.yaml:ro
      - cortex:/cortex
    networks: [default, ingestion]
  tempo:
    <<: *service
    image: grafana/tempo:3.1.0
    mem_limit: 2g
    command: [-target=all, -config.file=/etc/tempo/config.yaml, -config.expand-env=true]
    environment:
      TEMPO_S3_BUCKET: ${TEMPO_S3_BUCKET:?}
      TEMPO_S3_ENDPOINT: ${TEMPO_S3_ENDPOINT:?}
      TEMPO_S3_REGION: ${TEMPO_S3_REGION:?}
      TEMPO_S3_ACCESS_KEY_ID: ${TEMPO_S3_ACCESS_KEY_ID:?}
      TEMPO_S3_SECRET_ACCESS_KEY: ${TEMPO_S3_SECRET_ACCESS_KEY:?}
      TEMPO_S3_INSECURE: ${TEMPO_S3_INSECURE:-false}
      TEMPO_S3_FORCE_PATH_STYLE: ${TEMPO_S3_FORCE_PATH_STYLE:-false}
    volumes: [./tempo.yaml:/etc/tempo/config.yaml:ro, tempo:/var/tempo]
    networks: [default, ingestion]
  grafana:
    <<: *service
    image: grafana/grafana:13.2.3
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3001}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OIDC_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: Cloudflare
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OIDC_AUTH_URL:-}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GRAFANA_OIDC_TOKEN_URL:-}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GRAFANA_OIDC_USERINFO_URL:-}
      GF_AUTH_GENERIC_OAUTH_VALIDATE_ID_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_JWK_SET_URL: ${GRAFANA_OIDC_JWKS_URL:-}
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'${GRAFANA_OIDC_DEFAULT_ROLE:-Viewer}'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: ${GRAFANA_OIDC_SKIP_ORG_ROLE_SYNC:-true}
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN_FORM:-false}
      GF_AUTH_BASIC_ENABLED: ${GRAFANA_BASIC_AUTH_ENABLED:-true}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.22.1
      GRAFANA_CLICKHOUSE_PASSWORD: ${GRAFANA_CLICKHOUSE_PASSWORD:?}
      LANGFUSE_URL: ${LANGFUSE_URL:-http://localhost:3000}
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/relohome.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/relohome.yaml:ro
      - ./grafana/alerts.yaml:/etc/grafana/provisioning/alerting/relohome.yaml:ro
      - ./grafana/overview.json:/var/lib/grafana/dashboards/overview.json:ro
      - ./grafana/previews.json:/var/lib/grafana/dashboards/previews.json:ro
networks:
  default:
  ingestion:
    name: ${OBSERVABILITY_INGEST_NETWORK:-relohome-observability-ingest}
volumes:
  postgres:
  clickhouse:
  clickhouse-logs:
  redis:
  loki:
  cortex:
  grafana:
  tempo:
