name: lifeflow-telemetry-${OTEL_DEPLOYMENT_ENVIRONMENT:?}
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    command: [--config=/etc/otelcol/config.yaml]
    environment:
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:?}
      OTEL_COLLECTOR_TOKEN: ${OTEL_COLLECTOR_TOKEN:?}
      OBSERVABILITY_INGEST_PASSWORD: ${OBSERVABILITY_INGEST_PASSWORD:?}
      OBSERVABILITY_GATEWAY_URL: ${OBSERVABILITY_GATEWAY_URL:-http://telemetry-gateway:8080}
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
      - queue:/var/lib/otelcol
    networks:
      application:
        aliases: ["otel-collector", "otel-${OTEL_DEPLOYMENT_ENVIRONMENT}"]
      ingestion:
        aliases: ["otel-${OTEL_DEPLOYMENT_ENVIRONMENT}"]
networks:
  application:
    external: true
    name: ${APPLICATION_NETWORK:?}
  ingestion:
    external: true
    name: lifeflow-observability-ingest
volumes:
  queue:
