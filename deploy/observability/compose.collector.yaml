name: relohome-telemetry-${OTEL_DEPLOYMENT_ENVIRONMENT:?}
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    command: [--config=/etc/otelcol/config.yaml]
    environment:
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:?}
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
      - queue:/var/lib/otelcol
    networks:
      application:
        aliases: ["otel-collector"]
      ingestion: {}
networks:
  application:
    external: true
    name: ${APPLICATION_NETWORK:?}
  ingestion:
    external: true
    name: ${OBSERVABILITY_INGEST_NETWORK:-relohome-observability-ingest}
volumes:
  queue:
