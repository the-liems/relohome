groups:
- name: relohome-inventory
  interval: 30s
  rules:
  - record: relohome_expected_service_info
    expr: vector(1)
    labels:
      service_name: web
      environment: production
  - record: relohome_expected_service_info
    expr: vector(1)
    labels:
      service_name: backend
      environment: production
  - record: relohome_expected_service_info
    expr: vector(1)
    labels:
      service_name: platform
      environment: production
  - record: relohome_expected_service_info
    expr: vector(1)
    labels:
      service_name: location
      environment: production
  - record: relohome_expected_service_info
    expr: vector(1)
    labels:
      service_name: moving-api
      environment: production
  - record: relohome_expected_service_info
    expr: vector(1)
    labels:
      service_name: moving-mcp
      environment: production
  - record: relohome_expected_service_info
    expr: vector(1)
    labels:
      service_name: flights-mcp
      environment: production
  - record: relohome_expected_service_info
    expr: vector(1)
    labels:
      service_name: payments-mcp
      environment: production
