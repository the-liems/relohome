[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relohome-location-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai>=1.0.0", "python-dotenv>=1.0.0", "streamlit>=1.44.0", "streamlit-searchbox>=0.1.24", "pydeck>=0.9.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["relohome_location_demo*"]
