[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relohome-agent-services"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["opentelemetry-api==1.45.1", "fastapi==0.141.1", "pydantic==2.13.5", "pydantic-settings==2.15.0", "openai==3.16.2"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
