[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relohome-flight"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0", "pydantic-settings>=2.7.0", "httpx>=0.28.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
relohome_flight = ["catalog_data/*.json"]
