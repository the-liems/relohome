[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relohome-roommate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0", "cryptography>=44", "Pillow>=12.3,<13", "psycopg[binary,pool]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
