[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relohome-observability"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-starlette==0.66b1",
    "opentelemetry-instrumentation-psycopg==0.66b1",
    "opentelemetry-instrumentation-dbapi==0.66b1",
    "wrapt>=1.17,<3",
]

[project.entry-points.opentelemetry_distro]
relohome = "relohome_observability.bootstrap:ReloHomeDistro"

[project.entry-points.opentelemetry_configurator]
relohome = "relohome_observability.bootstrap:ReloHomeConfigurator"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
