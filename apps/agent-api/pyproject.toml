[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relohome-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langfuse==5.0.1", "opentelemetry-api==1.45.1", "opentelemetry-sdk==1.45.1", "fastapi>=0.115.0", "uvicorn[standard]>=0.34.0", "pydantic>=2.10.0", "pydantic-settings>=2.7.0", "langchain==1.4.5", "mcp>=2.3,<3", "langchain-openai>=0.3.0", "langgraph>=1.0", "langgraph-checkpoint-sqlite>=3,<4", "cryptography>=44", "httpx>=0.28.0", "httpx2>=2.13,<3", "jsonschema==4.26.0", "relohome-contracts==0.1.0", "relohome-privacy==0.1.0", "relohome-roommate==0.1.0", "relohome-flight==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["relohome_agent*"]

[tool.setuptools.package-data]
"relohome_agent.agents.subagents" = ["fixtures/*.json"]
