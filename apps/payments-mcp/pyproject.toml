[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relohome-payments-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["opentelemetry-api==1.45.1", "relohome-payment==0.1.0", "relohome-mcp-http==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["relohome_payments_mcp*"]
