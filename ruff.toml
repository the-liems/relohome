target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[format]
quote-style = "double"
indent-style = "space"

# Keep installed distribution imports grouped consistently across each src-layout app.
# Explicit classification avoids import-only churn as applications move (#114/#107).
[lint.isort]
known-third-party = ["relohome_agent", "relohome_demos", "relohome_flights_mcp", "relohome_intake", "relohome_orchestrator", "relohome_payments_mcp"]
